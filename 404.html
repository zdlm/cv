<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Leo Zhang</title>
  <meta name="robots" content="noindex">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='6' fill='%23C1272D'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='serif'%3E%E5%BC%A0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Newsreader:opsz@6..72&display=swap">
  <!-- Served at any depth under /cv/, so everything is inline and links are absolute -->
  <style>
    :root {
      --paper: #F3F4F2;
      --paper-2: #E6E9EC;
      --ink: #17202C;
      --muted: #586373;
      --seal: #C1272D;
      --bj: #8B939C;
      --cph: #E3A83C;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121820;
        --paper-2: #1C242F;
        --ink: #E7EAEE;
        --muted: #9AA4B1;
        --seal: #D9393F;
        --bj: #6B737C;
        --cph: #D69B30;
        color-scheme: dark;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "Newsreader", "Noto Serif SC", "Songti SC", Georgia, serif;
      font-size: 1.15rem;
      line-height: 1.6;
    }

    main {
      max-width: 34rem;
      padding: 2rem 16px;
    }

    .gap {
      display: flex;
      gap: 4px;
      margin-bottom: 2rem;
    }

    .gap i {
      width: 3.5rem;
      height: 1.6rem;
      border-radius: 3px;
      background: var(--bj);
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.16);
    }

    .gap i:nth-child(2) {
      background: transparent;
      box-shadow: none;
      outline: 2px dashed var(--seal);
      outline-offset: -2px;
    }

    .gap i:nth-child(3) {
      background: var(--cph);
    }

    h1 {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-size: clamp(2.2rem, 1.5rem + 3vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin: 0 0 1rem;
    }

    p {
      margin: 0 0 0.4rem;
      color: var(--muted);
    }

    a {
      display: inline-block;
      margin-top: 1.5rem;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 650;
      color: var(--paper);
      background: var(--ink);
      padding: 0.55rem 1.1rem;
      border-radius: 4px;
      text-decoration: none;
    }

    a:hover {
      background: var(--seal);
    }
  </style>
</head>

<body>
  <main>
    <div class="gap" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>This brick isn't laid yet.</h1>
    <p>The page you're looking for doesn't exist.</p>
    <p lang="da">Siden findes ikke.</p>
    <p lang="zh-CN">这块砖还没砌好，页面不存在。</p>
    <a href="/cv/">Back to Leo Zhang</a>
  </main>
</body>

</html>
